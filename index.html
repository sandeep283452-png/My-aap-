<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Wallet App</title>
    <style>
        /* बैकग्राउंड और बेसिक रिसेट */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* यहाँ आप अपनी पसंद के इंडियन करेंसी वाले पोस्टर का लिंक डाल सकते हैं */
            background-image: url('https://images.unsplash.com/photo-1623844390022-7901869e5d44?auto=format&fit=crop&w=1080&q=80'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* ऐप का मेन कंटेनर (Glassmorphism Effect) */
        .app-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* टॉप आइकन */
        .top-icon {
            font-size: 60px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        /* कॉइन बैलेंस कार्ड */
        .balance-card {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            color: #000;
            box-shadow: 0 4px 15px rgba(255, 170, 0, 0.4);
        }

        .balance-card h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }

        .balance-card .coins {
            font-size: 32px;
            font-weight: bold;
        }

        /* बटन्स का डिज़ाइन */
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            color: white;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* WhatsApp बटन */
        .whatsapp-btn {
            background: linear-gradient(135deg, #25D366, #128C7E);
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
        }

        /* Payment बटन */
        .payment-btn {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        /* पेमेंट सेक्शन (जो बटन क्लिक करने पर खुलेगा) */
        .payment-details {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="top-icon">💸 💰</div>
        
        <h2>आपका वॉलेट</h2>

        <div class="balance-card">
            <h3>कुल कॉइन्स (Balance)</h3>
            <div class="coins">🪙 50 Coins</div>
        </div>

        <a href="https://wa.me/27736060982?text=Hello,%20I%20want%20to%20withdraw%20my%20coins!" class="btn whatsapp-btn" target="_blank">
            💬 WhatsApp पर संपर्क करें
        </a>

        <button class="btn payment-btn" onclick="togglePayment()">
            💳 Payment Method
        </button>

        <div class="payment-details" id="payment-box">
            <p><strong>Withdrawal Options:</strong></p>
            <p>✅ UPI / Paytm / PhonePe</p>
            <p>✅ Bank Transfer</p>
            <p style="margin-top: 10px; font-size: 12px; color: #666;">
                *कृपया पेमेंट लेने के लिए ऊपर WhatsApp बटन पर क्लिक करके अपना UPI ID भेजें।
            </p>
        </div>
    </div>

    <script>
        // पेमेंट मेथड वाले बॉक्स को खोलने और बंद करने का फंक्शन
        function togglePayment() {
            var paymentBox = document.getElementById("payment-box");
            if (paymentBox.style.display === "none" || paymentBox.style.display === "") {
                paymentBox.style.display = "block";
            } else {
                paymentBox.style.display = "none";
            }
        }
    </script>

</body>
</html>
